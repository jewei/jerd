# XcodeGen source for Jerd.xcodeproj. Run `./dev generate` after a change.
# Build settings live in Configuration/*.xcconfig.
name: Jerd
options:
  bundleIdPrefix: dev.jerd
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
packages:
  JerdKit:
    path: Packages/JerdKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
targets:
  Jerd:
    type: application
    platform: macOS
    configFiles:
      Debug: Configuration/App.xcconfig
      Release: Configuration/App.xcconfig
    sources:
      - path: Apps/Jerd
        excludes: ["Resources/AppIcons/*"]
      - path: Apps/Jerd/Resources/AppIcons
        buildPhase: resources
        type: folder
    dependencies:
      - package: JerdKit
        product: JerdLive
      - package: Sparkle
      - target: JerdHelper
        embed: false
      - target: JerdCLI
        embed: false
    postCompileScripts:
      - name: Embed helper, launcher, and runtime payloads
        script: exec "$SRCROOT/Tools/Scripts/embed-app-contents.sh"
        basedOnDependencyAnalysis: false
  JerdHelper:
    type: tool
    platform: macOS
    configFiles:
      Debug: Configuration/Helper.xcconfig
      Release: Configuration/Helper.xcconfig
    sources:
      - path: Apps/JerdHelper
        excludes: ["*.plist"]
    dependencies:
      - package: JerdKit
        product: JerdHelperCore
  JerdCLI:
    type: tool
    platform: macOS
    configFiles:
      Debug: Configuration/CLI.xcconfig
      Release: Configuration/CLI.xcconfig
    sources: [Apps/JerdCLI]
    dependencies:
      - package: JerdKit
        product: JerdCLICore
schemes:
  Jerd:
    build:
      targets:
        Jerd: all
