name: CI

# The `check` job runs exactly `./dev check`: lint, the JerdKit and Tools tests, the Debug build, and
# an unsigned Release build without runtimes (`--allow-missing-runtimes`), each with a check of the
# built app. Run the same command locally before you push.
#
# The `runtime-integration` job (manual and weekly) prepares the pinned runtimes and runs the opt-in
# integration tests with them. It does not run on every pull request, because it downloads about
# 500 MB and builds Redis and XZ. Its cache is keyed on the pins, so a new pin prepares again.
#
# Each event kind has its own concurrency group. Thus a merge does not cancel the weekly runtime job,
# and a manual run does not cancel the check of the last merge. Only a new push to a pull request
# cancels the older run of that pull request. Other runs do not cancel a running run, but a group
# keeps at most one waiting run: a newer run replaces a run that waits. So when several merges come
# within one check, the merges between the first and the last get no check result of their own.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Every Monday at 04:00 UTC, for the runtime integration job.
    - cron: "0 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The XcodeGen release archive for the version in Tools/xcodegen-version.
  XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806

jobs:
  check:
    name: ./dev check
    if: github.event_name != 'schedule'
    # The newest GitHub-hosted image with the Xcode in .xcode-version (Xcode 27, Swift 6.4).
    # It is a preview image. The fallback is macos-26 with Xcode 26.6 (Swift 6.3).
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          version="$(cat .xcode-version)"
          sudo xcode-select --switch "/Applications/Xcode_${version}.app"
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          version="$(cat Tools/xcodegen-version)"
          archive="$RUNNER_TEMP/xcodegen.zip"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output "$archive" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${version}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  ${archive}" | shasum --algorithm 256 --check
          unzip -q "$archive" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Restore build caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/SourcePackages
            Tools/.build
            Packages/JerdKit/.build
          # Keyed on the Xcode version, the package manifests, and the resolved files.
          key: build-${{ runner.os }}-xcode-${{ hashFiles('.xcode-version') }}-${{ hashFiles('project.yml', '**/Package.swift', '**/Package.resolved', '!**/.build/**') }}
          restore-keys: |
            build-${{ runner.os }}-xcode-${{ hashFiles('.xcode-version') }}-

      - name: Check prerequisites
        run: ./dev doctor

      - name: Run ./dev check
        run: ./dev check

      - name: Upload failure logs
        # A failed quiet step writes its full output to .build/logs.
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dev-check-logs
          path: .build/logs
          if-no-files-found: ignore
          retention-days: 7

  runtime-integration:
    name: Runtime integration
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # The same image as the check job. See its comment.
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          version="$(cat .xcode-version)"
          sudo xcode-select --switch "/Applications/Xcode_${version}.app"
          xcodebuild -version

      - name: Restore prepared runtimes
        id: restore-runtimes
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Downloads are kept by SHA-256. Payloads and the XZ build are verified before every use.
          path: |
            .build/runtimes/downloads
            .build/runtimes/payloads
            .build/runtimes/support
          # The key hashes every input that changes the prepared bytes: the catalog, the deployment
          # target, and the preparation code. `./dev lint` checks this list (RuntimeCacheKeyPolicy).
          key: runtimes-${{ runner.os }}-${{ hashFiles('Runtimes/**', 'Configuration/Base.xcconfig', 'Packages/JerdKit/Sources/JerdManifest/**', 'Packages/JerdKit/Sources/JerdRuntimes/Preparation/**', 'Packages/JerdKit/Sources/JerdRuntimes/Installation/**', 'Packages/JerdKit/Sources/JerdRuntimes/Payloads/**', 'Packages/JerdKit/Sources/JerdRuntimes/Releases/**', 'Packages/JerdKit/Sources/JerdRuntimes/Bundled/PinnedPayloadPreparer.swift', 'Packages/JerdKit/Sources/JerdRuntimes/Bundled/RuntimePin+Release.swift', 'Tools/Sources/JerdDevKit/Runtimes/**') }}

      - name: Prepare runtimes
        run: ./dev runtimes prepare

      - name: Verify runtimes
        id: verify-runtimes
        run: ./dev runtimes verify

      - name: Save prepared runtimes
        # Save right after the verification, so that a failed or cancelled test keeps the prepared
        # runtimes. A partial preparation is not saved, because a saved cache key cannot change.
        if: >-
          always() && steps.verify-runtimes.outcome == 'success'
          && steps.restore-runtimes.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/runtimes/downloads
            .build/runtimes/payloads
            .build/runtimes/support
          key: ${{ steps.restore-runtimes.outputs.cache-primary-key }}

      - name: Run integration tests
        run: ./dev test --integration web,database,mail,storage

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-integration-logs
          path: .build/logs
          if-no-files-found: ignore
          retention-days: 7
