<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jerd app icon variants</title>
<style>
  :root {
    color-scheme: light;
    --page: #f2f2f7;
    --card: #ffffff;
    --text: #1c1c1e;
    --muted: #6e6e73;
    --line: #e5e5ea;
  }
  body.dark {
    color-scheme: dark;
    --page: #1c1c1e;
    --card: #2c2c2e;
    --text: #f5f5f7;
    --muted: #a1a1a6;
    --line: #3a3a3c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px;
    background: var(--page);
    color: var(--text);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
  }
  header { max-width: 1200px; margin: 0 auto 24px; }
  h1 { margin: 0 0 4px; font-size: 26px; }
  header p { margin: 0 0 12px; color: var(--muted); }
  label { margin-right: 20px; user-select: none; }
  main {
    max-width: 1200px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 20px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .card h2 { margin: 0; font-size: 17px; align-self: stretch; }
  .card p { margin: 2px 0 8px; color: var(--muted); align-self: stretch; min-height: 2.9em; }
  canvas.big { width: 280px; height: 280px; }
  .sizes { display: flex; align-items: flex-end; gap: 14px; margin: 8px 0 14px; }
  .sizes figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .sizes figcaption { font-size: 11px; color: var(--muted); }
  button {
    font: inherit;
    padding: 6px 14px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--page);
    color: var(--text);
    cursor: pointer;
  }
</style>
</head>
<body>
<header>
  <h1>Jerd app icon</h1>
  <p>Each variant is drawn with the Canvas 2D API on a 1024 × 1024 px canvas.
     The macOS shape uses the 824 px icon grid with a drop shadow.</p>
  <label><input type="checkbox" id="dark"> Dark page</label>
  <label><input type="checkbox" id="bleed"> Full-bleed square (no mask, for Icon Composer)</label>
</header>
<main id="grid"></main>

<script>
const SIZE = 1024;
const INSET = 100;               // macOS icon grid: 824 px body in a 1024 px canvas
const BODY = SIZE - INSET * 2;
const TAU = Math.PI * 2;

// ---------- Drawing helpers ----------

function squircle(ctx, x, y, w, h, n = 5) {
  const a = w / 2, b = h / 2, cx = x + a, cy = y + b, steps = 360;
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const t = (i / steps) * TAU, c = Math.cos(t), s = Math.sin(t);
    const px = cx + a * Math.sign(c) * Math.abs(c) ** (2 / n);
    const py = cy + b * Math.sign(s) * Math.abs(s) ** (2 / n);
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath();
}

function linear(ctx, x0, y0, x1, y1, colors) {
  const g = ctx.createLinearGradient(x0, y0, x1, y1);
  colors.forEach((c, i) => g.addColorStop(i / (colors.length - 1), c));
  return g;
}

function background(ctx, paint) {
  ctx.fillStyle = paint;
  ctx.fillRect(0, 0, SIZE, SIZE);
}

function circle(ctx, x, y, r, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, TAU);
  ctx.fill();
}

function roundRect(ctx, x, y, w, h, r, paint) {
  ctx.fillStyle = paint;
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, r);
  ctx.fill();
}

function shadow(ctx, color, blur, dy, draw) {
  ctx.save();
  ctx.shadowColor = color;
  ctx.shadowBlur = blur;
  ctx.shadowOffsetY = dy;
  draw();
  ctx.restore();
}

// A J stroke: stem from (x, top) down to y, then a hook that curls left.
function jStroke(ctx, x, top, y, radius, sweep = Math.PI) {
  ctx.beginPath();
  ctx.moveTo(x, top);
  ctx.lineTo(x, y);
  ctx.arc(x - radius, y, radius, 0, sweep);
  ctx.stroke();
}

function sparkle(ctx, x, y, r, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x, y - r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.quadraticCurveTo(x, y, x, y + r);
  ctx.quadraticCurveTo(x, y, x - r, y);
  ctx.quadraticCurveTo(x, y, x, y - r);
  ctx.fill();
}

// ---------- Variants (drawn full-bleed in 1024 × 1024 space) ----------

function drawMonogram(ctx) {
  background(ctx, linear(ctx, 0, 0, SIZE, SIZE, ['#7B5CFF', '#FF4FA0', '#FFA24C']));
  shadow(ctx, 'rgba(70, 0, 60, 0.30)', 40, 18, () => {
    ctx.strokeStyle = '#FFFFFF';
    ctx.lineWidth = 150;
    ctx.lineCap = 'round';
    jStroke(ctx, 640, 450, 650, 130, Math.PI * 0.9);
    circle(ctx, 640, 228, 86, '#FFE14D');
  });
}

function drawRainbow(ctx) {
  background(ctx, linear(ctx, 0, 0, 0, SIZE, ['#2D2B63', '#15142E']));
  const colors = ['#FF5D5D', '#FF9F1C', '#FFD23F', '#3DDC97', '#3A86FF', '#9B5DE5']; // outer → inner
  const width = 46, hole = 66, cx = 512, cy = 520, top = 160;
  ctx.lineWidth = width + 1;     // 1 px overlap hides seams between stripes
  ctx.lineCap = 'butt';
  colors.forEach((color, i) => {
    const r = hole + width * (colors.length - i - 0.5);
    ctx.strokeStyle = color;
    jStroke(ctx, cx + r, top, cy, r);
  });
  sparkle(ctx, 320, 330, 84, '#FFFFFF');
  sparkle(ctx, 440, 205, 38, '#FFD23F');
}

function drawElephant(ctx) {
  background(ctx, linear(ctx, 0, 0, SIZE, SIZE, ['#FFDE59', '#FF8A3D']));
  const skin = '#7F86FF', ear = '#666CF0', depth = 'rgba(140, 60, 0, 0.28)';
  shadow(ctx, depth, 40, 16, () => {
    circle(ctx, 318, 420, 185, ear);
    circle(ctx, 706, 420, 185, ear);
  });
  circle(ctx, 300, 432, 116, '#FF9CC8');
  circle(ctx, 724, 432, 116, '#FF9CC8');
  const headAndTrunk = () => {
    circle(ctx, 512, 410, 215, skin);
    ctx.strokeStyle = skin;      // The trunk is the J.
    ctx.lineWidth = 112;
    ctx.lineCap = 'round';
    jStroke(ctx, 512, 520, 700, 86);
  };
  shadow(ctx, depth, 40, 16, headAndTrunk);
  headAndTrunk();                // Repaint without shadow so only the outer shadow shows.
  circle(ctx, 400, 475, 30, 'rgba(255, 140, 200, 0.55)');
  circle(ctx, 624, 475, 30, 'rgba(255, 140, 200, 0.55)');
  circle(ctx, 432, 382, 28, '#1E1B4B');
  circle(ctx, 592, 382, 28, '#1E1B4B');
  circle(ctx, 442, 371, 9, '#FFFFFF');
  circle(ctx, 602, 371, 9, '#FFFFFF');
}

function drawDots(ctx) {
  background(ctx, linear(ctx, 0, 0, 0, SIZE, ['#222849', '#0F1222']));
  const glyph = ['00111', '00010', '00010', '00010', '10010', '10010', '01100'];
  const pitch = 112, r = 42, x0 = 512 - pitch * 2, y0 = 512 - pitch * 3;
  glyph.forEach((row, y) => [...row].forEach((bit, x) => {
    const px = x0 + x * pitch, py = y0 + y * pitch;
    if (bit === '0') return circle(ctx, px, py, r, 'rgba(255, 255, 255, 0.07)');
    const color = `hsl(${(320 + (x + y) * 24) % 360} 95% 62%)`;
    ctx.save();
    ctx.shadowColor = color;
    ctx.shadowBlur = 40;
    circle(ctx, px, py, r, color);
    ctx.restore();
  }));
}

function drawStack(ctx) {
  background(ctx, linear(ctx, 0, 0, SIZE, SIZE, ['#2EE6C5', '#1A8CFF']));
  const sites = [['#FF5E7E', 230], ['#FFC83D', 432], ['#8B5CF6', 634]];
  for (const [color, y] of sites) {
    shadow(ctx, 'rgba(0, 50, 100, 0.28)', 30, 12, () => roundRect(ctx, 212, y, 600, 160, 48, '#FFFFFF'));
    circle(ctx, 300, y + 80, 38, color);
    roundRect(ctx, 370, y + 60, 250, 40, 20, '#E3E8F2');
    roundRect(ctx, 652, y + 60, 72, 40, 20, '#E3E8F2');
  }
}

function drawLock(ctx) {
  background(ctx, linear(ctx, 0, 0, SIZE, SIZE, ['#3F8CFF', '#8A4DFF']));
  shadow(ctx, 'rgba(30, 0, 90, 0.32)', 40, 18, () => {
    ctx.strokeStyle = '#E9EDFF';
    ctx.lineWidth = 76;
    ctx.beginPath();
    ctx.moveTo(382, 520);
    ctx.lineTo(382, 390);
    ctx.arc(512, 390, 130, Math.PI, 0);
    ctx.lineTo(642, 520);
    ctx.stroke();
    roundRect(ctx, 292, 460, 440, 340, 72, linear(ctx, 0, 460, 0, 800, ['#FFD84D', '#FF9F1C']));
  });
  ctx.strokeStyle = '#7A3B00';   // J-shaped keyhole
  ctx.lineWidth = 50;
  ctx.lineCap = 'round';
  jStroke(ctx, 556, 550, 660, 44);
}

const variants = [
  { id: 'monogram', name: 'Monogram', note: 'Lowercase j on a sunset gradient. The dot is a yellow accent.', draw: drawMonogram },
  { id: 'rainbow', name: 'Rainbow hook', note: 'Six nested stripes make a J. Many sites, one app.', draw: drawRainbow },
  { id: 'elephant', name: 'Elephant', note: 'A friendly PHP elephant. Its trunk is the J.', draw: drawElephant },
  { id: 'dots', name: 'Dot matrix', note: 'A herd of colour dots spells J on a dark display.', draw: drawDots },
  { id: 'stack', name: 'Site stack', note: 'Three sites that run at the same time.', draw: drawStack },
  { id: 'lock', name: 'Secure J', note: 'An HTTPS lock with a J-shaped keyhole.', draw: drawLock },
];

// ---------- Rendering ----------

function canvas(size) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  return c;
}

function paintIcon(target, draw, bleed) {
  const art = canvas(SIZE);
  const actx = art.getContext('2d');
  draw(actx);

  const ctx = target.getContext('2d');
  ctx.clearRect(0, 0, SIZE, SIZE);
  if (bleed) {
    ctx.drawImage(art, 0, 0);
    return;
  }
  const masked = canvas(SIZE);
  const mctx = masked.getContext('2d');
  squircle(mctx, INSET, INSET, BODY, BODY);
  mctx.clip();
  mctx.imageSmoothingQuality = 'high';
  mctx.drawImage(art, INSET, INSET, BODY, BODY);
  shadow(ctx, 'rgba(0, 0, 0, 0.30)', 24, 10, () => ctx.drawImage(masked, 0, 0));
}

// Halve repeatedly so small sizes stay sharp.
function paintPreview(source, target) {
  let current = source;
  while (current.width / 2 >= target.width) {
    const next = canvas(current.width / 2);
    const nctx = next.getContext('2d');
    nctx.imageSmoothingQuality = 'high';
    nctx.drawImage(current, 0, 0, next.width, next.height);
    current = next;
  }
  const ctx = target.getContext('2d');
  ctx.clearRect(0, 0, target.width, target.height);
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(current, 0, 0, target.width, target.height);
}

const dpr = Math.min(2, Math.round(window.devicePixelRatio || 1));
const bleedToggle = document.getElementById('bleed');
const darkToggle = document.getElementById('dark');
const grid = document.getElementById('grid');

const cards = variants.map((variant) => {
  const card = document.createElement('section');
  card.className = 'card';
  card.innerHTML = `<h2>${variant.name}</h2><p>${variant.note}</p>`;

  const big = canvas(SIZE);
  big.className = 'big';
  card.append(big);

  const sizes = document.createElement('div');
  sizes.className = 'sizes';
  const previews = [128, 64, 32, 16].map((size) => {
    const figure = document.createElement('figure');
    const small = canvas(size * dpr);
    small.style.width = small.style.height = `${size}px`;
    figure.append(small);
    figure.insertAdjacentHTML('beforeend', `<figcaption>${size}</figcaption>`);
    sizes.append(figure);
    return small;
  });
  card.append(sizes);

  const button = document.createElement('button');
  button.textContent = 'Download 1024 px PNG';
  button.addEventListener('click', () => {
    big.toBlob((blob) => {
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `jerd-icon-${variant.id}${bleedToggle.checked ? '-square' : ''}.png`;
      link.click();
      setTimeout(() => URL.revokeObjectURL(link.href), 1000);
    }, 'image/png');
  });
  card.append(button);

  grid.append(card);
  return { variant, big, previews };
});

function renderAll() {
  for (const { variant, big, previews } of cards) {
    paintIcon(big, variant.draw, bleedToggle.checked);
    previews.forEach((preview) => paintPreview(big, preview));
  }
}

darkToggle.checked = matchMedia('(prefers-color-scheme: dark)').matches;
document.body.classList.toggle('dark', darkToggle.checked);
darkToggle.addEventListener('change', () => document.body.classList.toggle('dark', darkToggle.checked));
bleedToggle.addEventListener('change', renderAll);
renderAll();
</script>
</body>
</html>
